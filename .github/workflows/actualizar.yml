name: Actualizar precios
on:
  schedule:
    - cron: "0 6 * * *"   # todos los días, 3:00 hora de Argentina
  workflow_dispatch:       # permite correrlo a mano desde GitHub
permissions:
  contents: write
jobs:
  dar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scraper/dar_scraper.py
      - run: |
          git config user.name "actualizador"
          git config user.email "actualizador@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Actualizar precios DAR"
          git push
