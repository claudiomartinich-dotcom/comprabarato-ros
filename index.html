<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comprá Barato.Ros</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#022d60">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comprá Barato">
<style>
:root{--bg:#eef4fb;--card:#fff;--ink:#0b2347;--mute:#56657f;--line:#d3deec;--navy:#022d60;--green:#199c36;--greenbg:#e8f6ec;--red:#ed3c36;--blue:#047ec9;--yellow:#fdc71c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:#fff;text-align:center;padding:8px 10px 6px;border-bottom:5px solid var(--green);box-shadow:0 2px 0 var(--yellow)}
.top img{height:112px;width:auto;max-width:100%;display:block;margin:0 auto}
.sr{position:absolute;left:-9999px}
main{max-width:760px;margin:0 auto;padding:12px 14px 60px}
.search{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 10px;z-index:2}
input[type=search]{width:100%;font:inherit;padding:13px 16px;border:2px solid var(--navy);border-radius:14px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid rgba(25,156,54,.35);outline-offset:1px;border-color:var(--green)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
.scanbtn{flex:0 0 56px;border:2px solid var(--navy);background:var(--navy);border-radius:14px;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.scanbtn:active{background:var(--green);border-color:var(--green)}
#scan{position:fixed;inset:0;background:#000;z-index:10;display:flex;align-items:center;justify-content:center}
#scan[hidden]{display:none}
#scanVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:relative;width:80%;max-width:420px;height:26%;border:3px solid var(--green);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
#scanMsg{position:absolute;left:12px;right:12px;bottom:calc(120px + env(safe-area-inset-bottom));color:#fff;text-align:center;font-weight:600}
#scanClose{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#fff;color:var(--navy);border:0;border-radius:99px;padding:12px 28px;font:inherit;font-weight:700}
.tag.sim{background:#fff3d6;color:#8a5a00}
.group{margin:16px 2px 8px;color:var(--navy);font-weight:700;font-size:.9rem}
.summary{color:var(--navy);font-size:.92rem;margin:4px 2px 10px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.row.best{border-left-color:var(--green);background:var(--greenbg);border-color:#bfe6c9;border-left-color:var(--green)}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere;color:var(--navy)}
.meta{margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--mute)}
.chip{padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:.78rem}
.tag{padding:2px 10px;border-radius:99px;background:var(--green);color:#fff;font-weight:700;font-size:.78rem}
.price{font-size:1.28rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--navy);text-align:right}
.best .price{color:var(--green)}
.diff{font-size:.78rem;color:var(--red);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.empty{color:var(--mute);padding:26px 4px;text-align:center}
.foot{margin-top:22px;font-size:.82rem;color:var(--mute);line-height:1.6}
.foot .bad{color:#c0392b}
</style>
</head>
<body>
<header class="top"><img src="logo.png" alt="Comprá Barato.Ros"><h1 class="sr">Comprá Barato.Ros</h1></header>
<main>
  <div class="search"><input id="q" type="search" placeholder="Buscá un producto o escaneá el código" autocomplete="off" aria-label="Buscar producto">
    <button class="scanbtn" id="scanOpen" type="button" aria-label="Escanear código de barras"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8M18 8v8" stroke-width="1.8"/></svg></button></div>
  <div id="scan" hidden><video id="scanVideo" playsinline muted></video><div class="frame"></div><div id="scanMsg"></div><button id="scanClose" type="button">Cancelar</button></div>
  <div id="summary" class="summary"></div>
  <div id="results"></div>
  <div id="foot" class="foot"></div>
</main>
<script src="config.js"></script>
<script>
const KEY = "comparador_precios_v2";
let db = {};   // { "DAR": {fecha, items:[...]} }
let errores = [];

function guardar(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function leer(){ try{ const t = localStorage.getItem(KEY); if(t) db = JSON.parse(t); }catch(e){ db = {}; } }

const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const money = n => "$" + n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function color(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0)); return ["#022d60","#ed3c36","#047ec9","#d97706"][Math.abs(h)%4]; }

function precio(v){
  if(typeof v === "number") return v;
  let s = String(v).replace(/[^\d.,]/g,"");
  if(!s) return NaN;
  if(s.includes(",") && s.includes(".")) s = s.replace(/\./g,"").replace(",",".");
  else if(s.includes(",")) s = s.replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  return parseFloat(s);
}

function csv(texto){
  texto = texto.replace(/^\uFEFF/,"");
  const primera = texto.split(/\r?\n/)[0] || "";
  const sep = [";","\t",","].sort((a,b)=>primera.split(b).length-primera.split(a).length)[0];
  const filas=[]; let f=[], c="", q=false;
  for(let i=0;i<texto.length;i++){
    const ch=texto[i];
    if(q){ if(ch=='"'){ if(texto[i+1]=='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if(ch=='"') q=true;
    else if(ch===sep){ f.push(c); c=""; }
    else if(ch=="\n"){ f.push(c.replace(/\r$/,"")); filas.push(f); f=[]; c=""; }
    else c+=ch;
  }
  if(c||f.length){ f.push(c); filas.push(f); }
  return filas;
}

function aItems(filas){
  filas = filas.filter(r => r.some(x => String(x).trim() !== ""));
  if(filas.length < 2) throw new Error("El archivo no tiene filas de datos.");
  const enc = filas[0].map(norm);
  const iP = enc.findIndex(h => /producto|descrip|articulo|detalle|nombre/.test(h));
  const iN = enc.findIndex(h => /precio|price|importe|valor/.test(h));
  const iO = enc.findIndex(h => /oferta/.test(h));
  const iF = enc.findIndex(h => /fecha/.test(h));
  const iE = enc.findIndex(h => /ean|barra/.test(h));
  if(iP < 0 || iN < 0) throw new Error('No encontré las columnas. La primera fila debe tener algo como "producto" y "precio".');
  const items=[];
  for(const r of filas.slice(1)){
    const nombre = String(r[iP]||"").trim(), n = precio(r[iN]);
    if(nombre && isFinite(n)) items.push({p:nombre, n, o: iO>=0 && String(r[iO]).trim()!=="" , k:norm(nombre), e: iE>=0 ? claveEan(r[iE]) : ""});
  }
  if(!items.length) throw new Error("No encontré productos con precio válido.");
  items.fecha = iF>=0 ? String(filas[1][iF]||"").trim() : "";
  return items;
}


async function cargarFuente(f){
  if(!f.url || f.url.startsWith("PEGAR")) return;
  try{
    const r = await fetch(f.url, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const items = aItems(csv(await r.text()));
    db[f.nombre] = {fecha: items.fecha || new Date().toISOString().slice(0,10), items};
    guardar();
  }catch(e){
    errores.push(db[f.nombre] ? `${f.nombre}: sin conexión, se muestran los últimos precios guardados.` : `${f.nombre}: todavía no hay datos.`);
  }
}

function pie(){
  const n = Object.keys(db);
  document.getElementById("foot").innerHTML =
    n.map(x => `${esc(x)}: ${db[x].items.length} productos · precios del ${esc(db[x].fecha)}`).join("<br>") +
    errores.map(e => `<br><span class="bad">${esc(e)}</span>`).join("");
}

function claveEan(v){
  const t = String(v==null?"":v).trim();
  if(/e\+/i.test(t)) return "";
  const d = t.replace(/\D/g,"").replace(/^0+/,"");
  return d.length>=7 && d.length<=14 ? d : "";
}
function tokens(t){ return norm(t).replace(/,/g,".").replace(/(\d)([a-z])/g,"$1 $2").split(/[^a-z0-9.]+/).map(x => x.replace(/\.+$/,"")).filter(x => x.length>1 || /\d/.test(x)); }

function filaHtml(h, best, min, sim){
  const d = (best||sim) ? "" : `<div class="diff">+${money(h.n-min)}<br>+${Math.round((h.n/min-1)*100)}%</div>`;
  return `<div class="row${best?" best":""}"><div class="info"><div class="name">${esc(h.p)}</div><div class="meta"><span class="chip" style="background:${color(h.s)}">${esc(h.s)}</span>${best?'<span class="tag">más barato</span>':""}${sim?'<span class="tag sim">parecido</span>':""}${h.o?"<span>oferta</span>":""}</div></div><div><div class="price">${money(h.n)}</div>${d}</div></div>`;
}

function buscarCodigo(q, res, sum){
  const k = claveEan(q);
  const exactos=[];
  for(const s of Object.keys(db)) for(const it of db[s].items) if(k && it.e===k) exactos.push({s, ...it});
  if(!exactos.length){
    sum.textContent="";
    res.innerHTML=`<div class="empty">El código ${esc(q)} no está en ninguna lista todavía.<br>Probá buscando el producto por nombre.</div>`;
    return;
  }
  exactos.sort((a,b)=>a.n-b.n);
  const min = exactos[0].n, ref = exactos[0];
  const conCodigo = new Set(exactos.map(x=>x.s));
  const tr = tokens(ref.p);
  let html = exactos.map(h => filaHtml(h, h.n===min, min, false)).join("");
  let similares=[];
  for(const s of Object.keys(db)){
    if(conCodigo.has(s)) continue;
    const pts = db[s].items.map(it => { const ti = new Set(tokens(it.p)); return {s, ...it, sc: tr.filter(t => ti.has(t)).length / tr.length}; })
      .filter(x => x.sc >= 0.75).sort((a,b)=>b.sc-a.sc || a.n-b.n).slice(0,3);
    similares = similares.concat(pts);
  }
  if(similares.length) html += '<div class="group">Parecidos en otros súper (verificá que sea el mismo)</div>' + similares.map(h => filaHtml(h,false,min,true)).join("");
  sum.textContent = `${ref.p} · más barato: ${exactos[0].s} a ${money(min)}.`;
  res.innerHTML = html;
}

function buscar(){
  const q = document.getElementById("q").value.trim();
  const res = document.getElementById("results"), sum = document.getElementById("summary");
  if(!Object.keys(db).length){ sum.textContent=""; res.innerHTML='<div class="empty">Todavía no hay precios cargados. Si recién se instaló, esperá a la primera actualización automática.</div>'; return; }
  if(!q){ sum.textContent=""; res.innerHTML='<div class="empty">Escribí un producto o escaneá un código de barras para ver dónde conviene comprarlo.</div>'; return; }
  if(/^\d{8,14}$/.test(q)) return buscarCodigo(q, res, sum);
  const toks = norm(q).split(/\s+/).filter(Boolean);
  const hits=[];
  for(const s of Object.keys(db)) for(const it of db[s].items) if(toks.every(t => it.k.includes(t))) hits.push({s, ...it});
  hits.sort((a,b)=>a.n-b.n);
  if(!hits.length){ sum.textContent=""; res.innerHTML=`<div class="empty">No hay resultados para "${esc(q)}". Probá con menos palabras.</div>`; return; }
  const min = hits[0].n, shown = hits.slice(0,150);
  sum.textContent = `${hits.length} resultados. Más barato: ${hits[0].s} a ${money(min)}.` + (hits.length>150?" Mostrando los 150 más baratos.":"");
  res.innerHTML = shown.map(h => filaHtml(h, h.n===min, min, false)).join("");
}

/* ---- Escáner de código de barras ---- */
let stream=null, timer=null, zx=null;
const $ = id => document.getElementById(id);
function msgScan(t){ $("scanMsg").textContent = t; }
function cerrarScanner(){
  if(timer){ clearTimeout(timer); timer=null; }
  if(zx){ try{ zx.reset(); }catch(e){} zx=null; }
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream=null; }
  $("scanVideo").srcObject = null;
  $("scan").hidden = true;
}
function encontrado(codigo){
  cerrarScanner();
  try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
  $("q").value = codigo; buscar();
}
function cargarZx(){
  return new Promise((ok,no)=>{
    if(window.ZXing) return ok();
    const sc=document.createElement("script");
    sc.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    sc.onload=ok; sc.onerror=no; document.head.appendChild(sc);
  });
}
async function abrirScanner(){
  $("scan").hidden = false; msgScan("Abriendo la cámara...");
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ msgScan("Este navegador no permite usar la cámara. Escribí el código a mano."); return; }
  try{
    let det=null;
    if("BarcodeDetector" in window){ try{ det = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]}); }catch(e){ det=null; } }
    if(det){
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
      const v=$("scanVideo"); v.srcObject=stream; await v.play();
      msgScan("Apuntá al código de barras");
      const tick = async () => {
        if(!stream) return;
        try{ const r = await det.detect(v); if(r.length){ encontrado(r[0].rawValue); return; } }catch(e){}
        timer = setTimeout(tick, 200);
      };
      tick();
    }else{
      await cargarZx();
      zx = new ZXing.BrowserMultiFormatReader();
      msgScan("Apuntá al código de barras");
      await zx.decodeFromConstraints({video:{facingMode:"environment"}}, "scanVideo", r => { if(r) encontrado(r.getText()); });
    }
  }catch(e){
    msgScan("No se pudo abrir la cámara. Revisá que el navegador tenga permiso para usarla.");
  }
}
$("scanOpen").addEventListener("click", abrirScanner);
$("scanClose").addEventListener("click", cerrarScanner);

document.getElementById("q").addEventListener("input", buscar);
leer(); buscar(); pie();
Promise.all(FUENTES.map(cargarFuente)).then(() => { buscar(); pie(); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
