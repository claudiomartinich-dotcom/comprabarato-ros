<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comprá Barato.Ros</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comprá Barato">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#18202b;--mute:#667085;--line:#dfe3e8;--ok:#0b7a5a;--okbg:#e3f5ee;--btn:#18202b;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--ink:#e8ecf1;--mute:#98a2b3;--line:#2a3441;--ok:#4fd1a5;--okbg:#12342a;--btn:#e8ecf1;--btnink:#10151c}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--ink:#e8ecf1;--mute:#98a2b3;--line:#2a3441;--ok:#4fd1a5;--okbg:#12342a;--btn:#e8ecf1;--btnink:#10151c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:1.35rem;margin:4px 0 14px;letter-spacing:-.01em}
.search{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 10px;z-index:2}
input[type=search],input[type=text],select{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ok);outline-offset:1px}
.summary{color:var(--mute);font-size:.9rem;margin:4px 2px 10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.row.best{border-left-color:var(--ok);background:linear-gradient(0deg,var(--card),var(--card)) padding-box}
.info{flex:1;min-width:0}
.name{font-weight:550;overflow-wrap:anywhere}
.meta{margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--mute)}
.chip{padding:2px 9px;border-radius:99px;color:#fff;font-weight:600;font-size:.78rem}
.tag{padding:2px 8px;border-radius:99px;background:var(--okbg);color:var(--ok);font-weight:600;font-size:.78rem}
.price{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.diff{font-size:.78rem;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--mute);padding:26px 4px;text-align:center}
details{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
summary{cursor:pointer;padding:12px 0;font-weight:600}
.src{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.src small{color:var(--mute)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 12px}
button.main{background:var(--btn);color:var(--btnink);border-color:var(--btn);font-weight:600;padding:11px 16px;width:100%}
.form{display:grid;gap:10px;padding:10px 0 16px;border-top:1px solid var(--line)}
.form label{font-size:.88rem;color:var(--mute);display:grid;gap:5px}
.hint{font-size:.84rem;color:var(--mute);margin:0}
#msg{font-size:.9rem;min-height:1.2em;color:var(--ok)}
#msg.err{color:#c0392b}
.foot{margin-top:22px;font-size:.82rem;color:var(--mute);line-height:1.6}
.foot .bad{color:#c0392b}
</style>
</head>
<body>
<main>
  <h1>Comprá Barato.Ros</h1>
  <div class="search"><input id="q" type="search" placeholder="Buscá un producto: aceite girasol 900" autocomplete="off" aria-label="Buscar producto"></div>
  <div id="summary" class="summary"></div>
  <div id="results"></div>
  <div id="foot" class="foot"></div>
</main>
<script src="config.js"></script>
<script>
const KEY = "comparador_precios_v2";
let db = {};   // { "DAR": {fecha, items:[...]} }
let errores = [];

function guardar(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function leer(){ try{ const t = localStorage.getItem(KEY); if(t) db = JSON.parse(t); }catch(e){ db = {}; } }

const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const money = n => "$" + n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function color(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 45% 38%)`; }

function precio(v){
  if(typeof v === "number") return v;
  let s = String(v).replace(/[^\d.,]/g,"");
  if(!s) return NaN;
  if(s.includes(",") && s.includes(".")) s = s.replace(/\./g,"").replace(",",".");
  else if(s.includes(",")) s = s.replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  return parseFloat(s);
}

function csv(texto){
  texto = texto.replace(/^\uFEFF/,"");
  const primera = texto.split(/\r?\n/)[0] || "";
  const sep = [";","\t",","].sort((a,b)=>primera.split(b).length-primera.split(a).length)[0];
  const filas=[]; let f=[], c="", q=false;
  for(let i=0;i<texto.length;i++){
    const ch=texto[i];
    if(q){ if(ch=='"'){ if(texto[i+1]=='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if(ch=='"') q=true;
    else if(ch===sep){ f.push(c); c=""; }
    else if(ch=="\n"){ f.push(c.replace(/\r$/,"")); filas.push(f); f=[]; c=""; }
    else c+=ch;
  }
  if(c||f.length){ f.push(c); filas.push(f); }
  return filas;
}

function aItems(filas){
  filas = filas.filter(r => r.some(x => String(x).trim() !== ""));
  if(filas.length < 2) throw new Error("El archivo no tiene filas de datos.");
  const enc = filas[0].map(norm);
  const iP = enc.findIndex(h => /producto|descrip|articulo|detalle|nombre/.test(h));
  const iN = enc.findIndex(h => /precio|price|importe|valor/.test(h));
  const iO = enc.findIndex(h => /oferta/.test(h));
  const iF = enc.findIndex(h => /fecha/.test(h));
  if(iP < 0 || iN < 0) throw new Error('No encontré las columnas. La primera fila debe tener algo como "producto" y "precio".');
  const items=[];
  for(const r of filas.slice(1)){
    const nombre = String(r[iP]||"").trim(), n = precio(r[iN]);
    if(nombre && isFinite(n)) items.push({p:nombre, n, o: iO>=0 && String(r[iO]).trim()!=="" , k:norm(nombre)});
  }
  if(!items.length) throw new Error("No encontré productos con precio válido.");
  items.fecha = iF>=0 ? String(filas[1][iF]||"").trim() : "";
  return items;
}


async function cargarFuente(f){
  if(!f.url || f.url.startsWith("PEGAR")) return;
  try{
    const r = await fetch(f.url, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const items = aItems(csv(await r.text()));
    db[f.nombre] = {fecha: items.fecha || new Date().toISOString().slice(0,10), items};
    guardar();
  }catch(e){
    errores.push(db[f.nombre] ? `${f.nombre}: sin conexión, se muestran los últimos precios guardados.` : `${f.nombre}: todavía no hay datos.`);
  }
}

function pie(){
  const n = Object.keys(db);
  document.getElementById("foot").innerHTML =
    n.map(x => `${esc(x)}: ${db[x].items.length} productos · precios del ${esc(db[x].fecha)}`).join("<br>") +
    errores.map(e => `<br><span class="bad">${esc(e)}</span>`).join("");
}

function buscar(){
  const q = document.getElementById("q").value.trim();
  const res = document.getElementById("results"), sum = document.getElementById("summary");
  if(!Object.keys(db).length){ sum.textContent=""; res.innerHTML='<div class="empty">Todavía no hay precios cargados. Si recién se instaló, esperá a la primera actualización automática.</div>'; return; }
  if(!q){ sum.textContent=""; res.innerHTML='<div class="empty">Escribí un producto para ver dónde conviene comprarlo.</div>'; return; }
  const toks = norm(q).split(/\s+/).filter(Boolean);
  const hits=[];
  for(const s of Object.keys(db)) for(const it of db[s].items) if(toks.every(t => it.k.includes(t))) hits.push({s, ...it});
  hits.sort((a,b)=>a.n-b.n);
  if(!hits.length){ sum.textContent=""; res.innerHTML=`<div class="empty">No hay resultados para "${esc(q)}". Probá con menos palabras.</div>`; return; }
  const min = hits[0].n, shown = hits.slice(0,150);
  sum.textContent = `${hits.length} resultados. Más barato: ${hits[0].s} a ${money(min)}.` + (hits.length>150?" Mostrando los 150 más baratos.":"");
  res.innerHTML = shown.map(h => {
    const best = h.n===min;
    const d = best ? "" : `<div class="diff">+${money(h.n-min)}<br>+${Math.round((h.n/min-1)*100)}%</div>`;
    return `<div class="row${best?" best":""}"><div class="info"><div class="name">${esc(h.p)}</div><div class="meta"><span class="chip" style="background:${color(h.s)}">${esc(h.s)}</span>${best?'<span class="tag">más barato</span>':""}${h.o?"<span>oferta</span>":""}</div></div><div><div class="price">${money(h.n)}</div>${d}</div></div>`;
  }).join("");
}

document.getElementById("q").addEventListener("input", buscar);
leer(); buscar(); pie();
Promise.all(FUENTES.map(cargarFuente)).then(() => { buscar(); pie(); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
